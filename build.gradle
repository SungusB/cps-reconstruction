plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
}

group = 'com.infinity.cps'
version = '1.0.0'

kotlin {
    jvmToolchain(17)
}

application {
    mainClass = 'com.infinity.cps.reconstruction.cli.ReconstructionCli'
}

repositories {
    mavenCentral()
}

dependencies {
    // SootUp for CPG construction
    implementation 'org.soot-oss:sootup.core:2.0.0'
    implementation 'org.soot-oss:sootup.java.core:2.0.0'
    implementation 'org.soot-oss:sootup.java.bytecode.frontend:2.0.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
