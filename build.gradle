plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
}

group = 'com.infinity.cps'
version = '1.0.0'

kotlin {
    jvmToolchain(17)
}

application {
    mainClass = 'com.infinity.cps.reconstruction.cli.ReconstructionCli'
}

repositories {
    mavenCentral()
}

configurations {
    // Not a dependency of the analysis tool itself — only resolved so
    // scripts/run_ablation.sh can put a real kotlinx-coroutines-core jar on
    // kotlinc's classpath when compiling benchmark/concurrency/*.kt, which
    // reference async/await/coroutineScope/supervisorScope/withContext.
    benchmarkCoroutines
}

dependencies {
    // SootUp for CPG construction
    implementation 'org.soot-oss:sootup.core:2.0.0'
    implementation 'org.soot-oss:sootup.java.core:2.0.0'
    implementation 'org.soot-oss:sootup.java.bytecode.frontend:2.0.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    benchmarkCoroutines 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
}

test {
    useJUnitPlatform()
}

tasks.register('printBenchmarkClasspath') {
    doLast {
        println configurations.benchmarkCoroutines.asPath
    }
}
